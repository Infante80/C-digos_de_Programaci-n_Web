<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Iniciar sesión · Herrería Hernández</title>
    <link rel="icon" href="herreria-icono.png?v=2" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="acceso">

    <aside class="acceso-escena" aria-hidden="true">
        <a class="logo" href="index.html" tabindex="-1">Herrería Hernández</a>
        <div class="acceso-lema">
            <span class="acceso-linea"></span>
            <p class="acceso-titulo">Forjado<span>a tu medida</span></p>
            <p class="acceso-texto">Da seguimiento a tus cotizaciones y proyectos desde un solo lugar.</p>
        </div>
    </aside>

    <main class="acceso-panel">
        <a class="volver" href="index.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            Volver al sitio
        </a>

        <div class="acceso-caja" id="accesoCaja">
            <p class="acceso-eyebrow">Área de clientes</p>
            <h1 id="accesoTitulo">Iniciar sesión</h1>
            <p class="acceso-sub" id="accesoSub">Ingresa con tu usuario y contraseña.</p>

            <div class="pestanas" role="tablist" aria-label="Tipo de acceso">
                <span class="pestanas-marca" aria-hidden="true"></span>
                <button type="button" role="tab" id="tabLogin" aria-selected="true" data-modo="login">Iniciar sesión</button>
                <button type="button" role="tab" id="tabRegistro" aria-selected="false" data-modo="registro">Crear cuenta</button>
            </div>

            <form id="formAcceso" novalidate>
                <input type="hidden" name="accion" id="accion" value="login">

                <div class="campo">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" autocomplete="username"
                           autocapitalize="none" spellcheck="false" maxlength="30" placeholder="Ej. juan_perez">
                    <small class="error" id="errorUsuario"></small>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <div class="clave">
                        <input type="password" id="password" name="password" autocomplete="current-password"
                               maxlength="72" placeholder="••••••••">
                        <button type="button" class="ver-clave" data-para="password" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="ojo" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="ojo-tachado" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7c2 0 3.7.7 5.1 1.6M22 12s-3.6 7-10 7c-2 0-3.7-.7-5.1-1.6"/><path d="M4 20L20 4"/></svg>
                        </button>
                    </div>
                    <small class="pista" id="pistaPassword">Mínimo 8 caracteres.</small>
                    <small class="error" id="errorPassword"></small>
                </div>

                <div class="campo-extra" id="campoConfirmar">
                    <div class="campo">
                        <label for="confirmar">Confirmar contraseña</label>
                        <div class="clave">
                            <input type="password" id="confirmar" name="confirmar" autocomplete="new-password"
                                   maxlength="72" placeholder="••••••••" disabled>
                            <button type="button" class="ver-clave" data-para="confirmar" aria-label="Mostrar contraseña" aria-pressed="false" tabindex="-1">
                                <svg class="ojo" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                                <svg class="ojo-tachado" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7c2 0 3.7.7 5.1 1.6M22 12s-3.6 7-10 7c-2 0-3.7-.7-5.1-1.6"/><path d="M4 20L20 4"/></svg>
                            </button>
                        </div>
                        <small class="error" id="errorConfirmar"></small>
                    </div>
                </div>

                <div class="aviso" id="aviso" role="alert"></div>

                <button class="btn enviar" type="submit" id="btnEnviar">
                    <span class="enviar-texto" id="btnTexto">Entrar</span>
                    <span class="giro" aria-hidden="true"></span>
                </button>
            </form>

            <p class="cambiar" id="cambiar">
                ¿No tienes cuenta? <button type="button" data-modo="registro">Crea una</button>
            </p>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
